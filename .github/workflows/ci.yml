name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reject Mapbox secret tokens
        # Real secret tokens have a long base64url payload. The 30+ char threshold avoids
        # false positives on the short fake values used in unit tests.
        run: |
          if git grep -nE 'sk\.[A-Za-z0-9_-]{30,}' -- . ':!pnpm-lock.yaml'; then
            echo "::error::A Mapbox secret token (sk.) was found in the repository."
            exit 1
          fi

      # The same script developers run before every push (see CLAUDE.md): local and CI cannot diverge.
      - run: pnpm check

      # E2E runs on the build `pnpm check` just made. The story tests need no WebGL and no Mapbox token.
      - name: Install Chromium for the E2E tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm --filter web e2e

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI is MIT licensed. The official Action ships under a commercial EULA,
      # so we download the CLI directly and verify its pinned SHA-256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history
        run: ./gitleaks git --redact --verbose --exit-code 1
